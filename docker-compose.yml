services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lab_scheduler_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_scalable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_network

  # FastAPI Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: lab_scheduler_backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/lab_scalable
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://frontend:5173
      SEED_ON_STARTUP: "true"
      RESET_DB_ON_STARTUP: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend:/app
    networks:
      - lab_network
    restart: on-failure:3

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: lab_scheduler_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - lab_network
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:

networks:
  lab_network:
    driver: bridge
